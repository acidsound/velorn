name: Remote ComfyUI build verification

on:
  push:
    branches: [agent/remote-comfyui]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-comfyui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary verification workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remote-comfy-build-check.yml
          git add .github/workflows/remote-comfy-build-check.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove remote ComfyUI build verification"
          git push origin HEAD:agent/remote-comfyui
